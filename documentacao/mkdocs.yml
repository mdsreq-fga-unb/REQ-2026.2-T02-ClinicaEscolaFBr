site_name: Clínica Escola FBr - Documentação
site_description: Documentação do projeto Clínica Escola FBr para as entregas das Unidades 1 a 4.
site_url: https://mdsreq-fga-unb.github.io/REQ-2026.2-T02-ClinicaEscolaFBr/
repo_url: https://github.com/mdsreq-fga-unb/REQ-2026.2-T02-ClinicaEscolaFBr
repo_name: REQ-2026.2-T02-ClinicaEscolaFBr
copyright: Clínica Escola FBr · Documentação acadêmica do projeto · 2026
extra_css: [assets/stylesheets/extra.css, assets/stylesheets/reading.css, assets/stylesheets/melhorias.css]
extra_javascript: [assets/javascripts/extra.js, assets/javascripts/reading.js, assets/javascripts/matriz.js, assets/javascripts/melhorias.js]
theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo-fbr.png
  favicon: assets/favicon.png
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: material/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

# Números exibidos na página inicial (overrides/home.html). Os de requisitos
# funcionais e não funcionais são recalculados no build a partir do catálogo
# (dados/requisitos.yml); o valor abaixo é só o padrão.
extra:
  home:
    stats:
      - value: "100"
        label: vagas de atendimento por semestre
      - value: "14"
        label: características de produto
      - value: "68"
        label: requisitos funcionais
      - value: "57"
        label: requisitos não funcionais

plugins:
  - search
  # Gera as tabelas de priorização, MVP, backlog, os índices e as contagens a
  # partir do catálogo de requisitos (AUD-30). Só as páginas com
  # "render_macros: true" no cabeçalho passam pelas macros.
  - macros:
      module_name: macros/catalogo
      render_by_default: false
      on_error_fail: true
      on_undefined: strict
  # Os endereços anteriores à reorganização em produto, requisitos, processo,
  # construção e histórico continuam funcionando: cada um vira uma página que
  # leva ao endereço novo, com o mesmo trecho (#âncora) do link.
  - redirects:
      redirect_maps:
        analise-ux-capitulo-10.md: historico/unidade-2/analise-ux.md
        organizacao-e-atualizacao.md: visao-geral/organizacao-e-atualizacao.md
        unidade-1/cenario-atual.md: produto/cenario-atual.md
        unidade-1/engenharia-requisitos.md: processo/engenharia-requisitos.md
        unidade-1/estrategia-esw.md: processo/estrategia-esw.md
        unidade-1/estudos/fdd.md: processo/estudo-fdd.md
        unidade-1/gestao/boas-praticas-github.md: processo/boas-praticas-github.md
        unidade-1/gestao/cronograma.md: historico/unidade-1/cronograma.md
        unidade-1/gestao/equipe-comunicacao.md: processo/equipe-e-cliente.md
        unidade-1/index.md: historico/unidade-1/index.md
        unidade-1/intervencao-social.md: produto/intervencao-social.md
        unidade-1/licoes-aprendidas.md: historico/unidade-1/licoes-aprendidas.md
        unidade-1/referencias.md: historico/unidade-1/referencias.md
        unidade-1/reunioes.md: historico/unidade-1/reunioes.md
        unidade-1/solucao-proposta.md: produto/solucao-proposta.md
        unidade-2/gestao/cronograma.md: historico/unidade-2/cronograma.md
        unidade-2/index.md: historico/unidade-2/index.md
        unidade-2/licoes-aprendidas.md: historico/unidade-2/licoes-aprendidas.md
        unidade-2/requisitos/analise-feedback.md: requisitos/analise-feedback.md
        unidade-2/requisitos/backlog.md: requisitos/priorizacao-e-mvp.md
        unidade-2/requisitos/decisoes-fbr.md: requisitos/decisoes-fbr.md
        unidade-2/requisitos/dor-dod.md: requisitos/dor-dod.md
        unidade-2/requisitos/funcionais.md: requisitos/funcionais.md
        unidade-2/requisitos/nao-funcionais.md: requisitos/nao-funcionais.md
        unidade-2/reunioes.md: historico/unidade-2/reunioes.md
        unidade-3/arquitetura.md: construcao/arquitetura.md
        unidade-3/copia-de-seguranca.md: construcao/copia-de-seguranca.md
        unidade-3/gestao/cronograma.md: historico/unidade-3/cronograma.md
        unidade-3/implantacao.md: construcao/implantacao.md
        unidade-3/index.md: historico/unidade-3/index.md
        unidade-3/licoes-aprendidas.md: historico/unidade-3/licoes-aprendidas.md
        unidade-3/projeto-features-ciclo-3.md: construcao/projeto-features.md
        unidade-3/projeto-features-ciclo-4.md: construcao/projeto-features.md
        unidade-3/projeto-features.md: construcao/projeto-features.md
        unidade-3/prototipos-ciclo-3.md: construcao/prototipos.md
        unidade-3/prototipos-ciclo-4.md: construcao/prototipos.md
        unidade-3/prototipos.md: construcao/prototipos.md
        unidade-3/reunioes.md: historico/unidade-3/reunioes.md
        unidade-3/seguranca-da-implantacao.md: construcao/implantacao.md
        unidade-3/termo-consentimento.md: construcao/termo-consentimento.md
        unidade-3/teste-de-carga.md: construcao/teste-de-carga.md

# Avisos que, com "mkdocs build --strict" no docs-check, impedem a publicação:
# páginas fora do menu, links para páginas inexistentes e âncoras inválidas.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      permalink_title: Link para esta seção

nav:
  - Início: index.md
  - Visão geral:
      - Organização e atualização: visao-geral/organizacao-e-atualizacao.md
      - Cronograma geral: visao-geral/cronograma.md
      - Features e backlog: visao-geral/backlog.md
      - Execução do processo: visao-geral/execucao-do-processo.md
  - Produto e requisitos:
      - Produto:
          - Cenário atual: produto/cenario-atual.md
          - Solução proposta: produto/solucao-proposta.md
          - Intervenção social: produto/intervencao-social.md
      - Requisitos:
          - Requisitos funcionais: requisitos/funcionais.md
          - Requisitos não funcionais: requisitos/nao-funcionais.md
          - Análise do feedback: requisitos/analise-feedback.md
          - Decisões com a FBr: requisitos/decisoes-fbr.md
          - DoR e DoD: requisitos/dor-dod.md
          - Priorização e MVP: requisitos/priorizacao-e-mvp.md
  - Processo e equipe:
      - Estratégia de ESW: processo/estrategia-esw.md
      - Engenharia de requisitos: processo/engenharia-requisitos.md
      - Verificação e validação: processo/verificacao-e-validacao.md
      - Equipe e cliente: processo/equipe-e-cliente.md
      - Boas práticas no GitHub: processo/boas-praticas-github.md
      - Estudo de FDD: processo/estudo-fdd.md
  - Construção do MVP:
      - Arquitetura técnica: construcao/arquitetura.md
      - Projeto das features: construcao/projeto-features.md
      - Protótipos: construcao/prototipos.md
      - Termo de consentimento (versão 0.1): construcao/termo-consentimento.md
      - Implantação e operação:
          - Implantação e segurança: construcao/implantacao.md
          - Cópia de segurança e restauração: construcao/copia-de-seguranca.md
          - Teste de carga: construcao/teste-de-carga.md
  - Histórico das unidades:
      - Unidade 3 (em andamento):
          - Início da unidade: historico/unidade-3/index.md
          - Cronograma e Entregas: historico/unidade-3/cronograma.md
          - Reuniões: historico/unidade-3/reunioes.md
          - Lições Aprendidas: historico/unidade-3/licoes-aprendidas.md
      - Unidade 2 (entregue em 13/10):
          - Início da unidade: historico/unidade-2/index.md
          - Cronograma e Entregas: historico/unidade-2/cronograma.md
          - Reuniões: historico/unidade-2/reunioes.md
          - Lições Aprendidas: historico/unidade-2/licoes-aprendidas.md
          - Análise de UX do site: historico/unidade-2/analise-ux.md
      - Unidade 1 (entregue em 07/09):
          - Início da unidade: historico/unidade-1/index.md
          - Cronograma e Entregas: historico/unidade-1/cronograma.md
          - Reuniões: historico/unidade-1/reunioes.md
          - Lições Aprendidas: historico/unidade-1/licoes-aprendidas.md
          - Referências: historico/unidade-1/referencias.md
