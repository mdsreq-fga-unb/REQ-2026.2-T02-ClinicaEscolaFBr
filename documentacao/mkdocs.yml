site_name: Clínica Escola FBr - Documentação
site_description: Documentação do projeto Clínica Escola FBr para as entregas das Unidades 1 a 4.
site_url: https://mdsreq-fga-unb.github.io/REQ-2026.2-T02-ClinicaEscolaFBr/
repo_url: https://github.com/mdsreq-fga-unb/REQ-2026.2-T02-ClinicaEscolaFBr
repo_name: REQ-2026.2-T02-ClinicaEscolaFBr
copyright: Clínica Escola FBr · Documentação acadêmica do projeto · 2026
extra_css: [assets/stylesheets/extra.css, assets/stylesheets/reading.css, assets/stylesheets/melhorias.css]
extra_javascript: [assets/javascripts/extra.js, assets/javascripts/reading.js, assets/javascripts/matriz.js, assets/javascripts/melhorias.js]
theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo-fbr.png
  favicon: assets/favicon.png
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: material/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

# Números exibidos na página inicial (overrides/home.html). Os de requisitos
# funcionais e não funcionais são recalculados no build a partir do catálogo
# (dados/requisitos.yml); o valor abaixo é só o padrão.
extra:
  home:
    stats:
      - value: "100"
        label: vagas de atendimento por semestre
      - value: "14"
        label: características de produto
      - value: "68"
        label: requisitos funcionais
      - value: "57"
        label: requisitos não funcionais

plugins:
  - search
  # Gera as tabelas de priorização, MVP, backlog, os índices e as contagens a
  # partir do catálogo de requisitos (AUD-30). Só as páginas com
  # "render_macros: true" no cabeçalho passam pelas macros.
  - macros:
      module_name: macros/catalogo
      render_by_default: false
      on_error_fail: true
      on_undefined: strict

# Avisos que, com "mkdocs build --strict" no docs-check, impedem a publicação:
# páginas fora do menu, links para páginas inexistentes e âncoras inválidas.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      permalink_title: Link para esta seção

nav:
  - Início: index.md
  - Visão geral:
      - Organização e atualização: organizacao-e-atualizacao.md
      - Cronograma geral: visao-geral/cronograma.md
      - Features e backlog: visao-geral/backlog.md
      - Execução do processo: visao-geral/execucao-do-processo.md
  - Produto e requisitos:
      - Produto:
          - 1. Cenário Atual: unidade-1/cenario-atual.md
          - 2. Solução Proposta: unidade-1/solucao-proposta.md
          - 3. Intervenção Social: unidade-1/intervencao-social.md
      - Requisitos:
          - 8.1 Requisitos Funcionais: unidade-2/requisitos/funcionais.md
          - 8.2 Requisitos Não Funcionais: unidade-2/requisitos/nao-funcionais.md
          - 8.3 Análise do Feedback: unidade-2/requisitos/analise-feedback.md
          - 8.4 Registro de Decisões com a FBr: unidade-2/requisitos/decisoes-fbr.md
          - 9. DoR e DoD: unidade-2/requisitos/dor-dod.md
          - 10. Priorização e MVP: unidade-2/requisitos/backlog.md
  - Processo e equipe:
      - 4. Estratégia de ESW: unidade-1/estrategia-esw.md
      - 5. Engenharia de Requisitos: unidade-1/engenharia-requisitos.md
      - 7. Interação entre Equipe e Cliente: unidade-1/gestao/equipe-comunicacao.md
      - Boas práticas no GitHub: unidade-1/gestao/boas-praticas-github.md
      - Estudo de FDD: unidade-1/estudos/fdd.md
      - Referências: unidade-1/referencias.md
  - Construção do MVP:
      - Arquitetura técnica: unidade-3/arquitetura.md
      - Projeto das features do Ciclo 3: unidade-3/projeto-features-ciclo-3.md
      - Protótipos do Ciclo 3: unidade-3/prototipos-ciclo-3.md
      - Projeto das features do Ciclo 4: unidade-3/projeto-features-ciclo-4.md
      - Protótipos do Ciclo 4: unidade-3/prototipos-ciclo-4.md
      - Termo de consentimento (versão 0.1): unidade-3/termo-consentimento.md
      - Implantação: unidade-3/implantacao.md
      - Cópia de segurança e restauração: unidade-3/copia-de-seguranca.md
      - Segurança da implantação: unidade-3/seguranca-da-implantacao.md
      - Teste de carga: unidade-3/teste-de-carga.md
  - Histórico das unidades:
      - Unidade 3 (em andamento):
          - Início da unidade: unidade-3/index.md
          - Cronograma e Entregas: unidade-3/gestao/cronograma.md
          - Reuniões: unidade-3/reunioes.md
          - Lições Aprendidas: unidade-3/licoes-aprendidas.md
      - Unidade 2 (entregue em 13/10):
          - Início da unidade: unidade-2/index.md
          - Cronograma e Entregas: unidade-2/gestao/cronograma.md
          - Reuniões: unidade-2/reunioes.md
          - Lições Aprendidas: unidade-2/licoes-aprendidas.md
          - Análise de UX do site: analise-ux-capitulo-10.md
      - Unidade 1 (entregue em 07/09):
          - Início da unidade: unidade-1/index.md
          - 6. Cronograma e Entregas: unidade-1/gestao/cronograma.md
          - Reuniões: unidade-1/reunioes.md
          - Lições Aprendidas: unidade-1/licoes-aprendidas.md
