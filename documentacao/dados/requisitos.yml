- id: RNF39
  nome: Auditoria de emissões e reemissões
  cp: CP10
  classificacao: Associado a RF do MVP
  relacionado: RF45
  justificativa: Acompanha a emissão, registrando autoria e operação; a reemissão (RF46) fica fora por ora, e a parte da meta referente a ela entra no escopo de auditoria quando for incorporada.

- id: RNF40
  nome: Tempo de geração da declaração
  cp: CP10
  classificacao: Evolutivo
  relacionado: RF45
  justificativa: Meta de desempenho que pode ser calibrada após o fluxo de emissão.

- id: RNF41
  nome: Usabilidade da emissão
  cp: CP10
  classificacao: Evolutivo
  relacionado: RF45
