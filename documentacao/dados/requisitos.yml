rnfs:

- id: RNF1
  nome: Identificação e recuperação de erros no formulário
  cp: CP1
  classificacao: Associado a RF do MVP
  relacionado: RF1
  justificativa: Aplica-se diretamente à inscrição on-line e evita perda dos dados válidos durante correções.

- id: RNF2
  nome: Proteção das informações no comprovante de inscrição
  cp: CP1
  classificacao: Associado a RF do MVP
  relacionado: RF2
  justificativa: RF2 está no recorte do MVP (Should have de esforço baixo); o comprovante de inscrição existe desde a primeira versão e sua proteção deve acompanhar o requisito.

- id: RNF3
  nome: Sigilo das informações de triagem
  cp: CP2
  classificacao: Obrigatório para o MVP
  relacionado: CP2
  justificativa: Protege dados sensíveis de triagem e é condição mínima de privacidade.

- id: RNF4
  nome: Rastreabilidade das regras de sinalização
  cp: CP2
  classificacao: Não aplicável ao MVP
  relacionado: RF5
  justificativa: Depende da sinalização automática de pontos de atenção; RF5 fica fora do MVP. Reavaliar se RF5 for incorporado.

- id: RNF5
  nome: Integridade e auditoria das decisões de prioridade
  cp: CP2
  classificacao: Obrigatório para o MVP
  relacionado: RF6
  justificativa: A prioridade clínica afeta a fila e precisa preservar autoria, histórico e integridade.

- id: RNF6
  nome: Privacidade e controle de acesso à consulta da fila
  cp: CP3
  classificacao: Obrigatório para o MVP
  relacionado: RF8, RF52
  justificativa: A consulta individual envolve dado pessoal e exige verificação de identidade.

- id: RNF7
  nome: Compreensibilidade das informações sobre a posição na fila
  cp: CP3
  classificacao: Associado a RF do MVP
  relacionado: RF8
  justificativa: Acompanha a consulta de posição e evita interpretação da posição como garantia de prazo.

- id: RNF8
  nome: Confiabilidade das informações institucionais da fila
  cp: CP3
  classificacao: Não aplicável ao MVP
  relacionado: RF9
  justificativa: Relaciona-se às informações gerais da fila; RF9 fica fora do MVP. Reavaliar se RF9 for incorporado.

- id: RNF9
  nome: Integridade do agendamento
  cp: CP4
  classificacao: Obrigatório para o MVP
  relacionado: CP4
  justificativa: Evita conflitos de agenda e estados incompatíveis; condição operacional mínima, reforçada pela promoção de RF10 ao MVP.

- id: RNF10
  nome: Auditoria das operações sobre a sessão
  cp: CP4
  classificacao: Associado a RF do MVP
  relacionado: RF10, RF14, RF15, RF16
  justificativa: Acompanha agendamento, confirmação de presença e cancelamento (pelo paciente e pelo estagiário) — todos no MVP — preservando rastreabilidade das alterações; a parte da meta referente ao reagendamento (RF12) entra no escopo quando o requisito for incorporado.

- id: RNF11
  nome: Confiabilidade do envio de lembretes
  cp: CP4
  classificacao: Não aplicável ao MVP
  relacionado: RF13
  justificativa: Depende do lembrete automático; RF13 fica fora do MVP (o link de confirmação do RF14 é enviado no próprio agendamento, RF10). Reavaliar se RF13 for incorporado.
  origem: [DF24, DF48]

- id: RNF12
  nome: Tempo de resposta nas operações de agendamento
  cp: CP4
  classificacao: Evolutivo
  relacionado: CP4
  justificativa: Meta quantitativa de desempenho que pode ser calibrada com testes de carga após o fluxo mínimo (RF10, RF11, RF14–RF17) estar em produção.
  origem: [DF22]

- id: RNF13
  nome: Minimização de dados na agenda
  cp: CP4
  classificacao: Obrigatório para o MVP
  relacionado: RF11
  justificativa: Reduz exposição de dados e atende ao princípio de minimização.

- id: RNF14
  nome: Disponibilidade do módulo de agendamento
  cp: CP4
  classificacao: Evolutivo
  relacionado: CP4
  justificativa: Meta formal de disponibilidade depende de infraestrutura e monitoramento, a formalizar após o MVP.

- id: RNF15
  nome: Usabilidade da confirmação de presença pelo paciente
  cp: CP4
  classificacao: Associado a RF do MVP
  relacionado: RF14
  justificativa: Acompanha a confirmação de presença pelo público atendido.

- id: RNF16
  nome: Autorização para distribuição, vínculo e transferência de casos
  cp: CP5
  classificacao: Obrigatório para o MVP
  relacionado: RF20, RF21, RF25
  justificativa: Alterações de responsabilidade clínica, inclusive a transferência de caso, exigem autorização por perfil.

- id: RNF17
  nome: Privacidade dos dados nas telas de distribuição e consulta
  cp: CP5
  classificacao: Obrigatório para o MVP
  relacionado: CP5
  justificativa: As telas de distribuição não devem expor dados além do necessário.
  origem: [DF16]

- id: RNF18
  nome: Auditoria de atribuições, vínculos e transferências
  cp: CP5
  classificacao: Associado a RF do MVP
  relacionado: RF20, RF21, RF25
  justificativa: Acompanha distribuição, vínculo e transferência de responsáveis, preservando rastreabilidade de todas elas.

- id: RNF19
  nome: Integridade dos vínculos de responsabilidade
  cp: CP5
  classificacao: Obrigatório para o MVP
  relacionado: RF20, RF21
  justificativa: Impede vínculos incompatíveis e preserva consistência de responsabilidade.

- id: RNF20
  nome: Continuidade do histórico na troca de responsável
  cp: CP5
  classificacao: Associado a RF do MVP
  relacionado: RF25
  justificativa: Acompanha a transferência de caso e preserva o histórico na troca de responsável.

- id: RNF21
  nome: Desempenho das listagens e operações de vínculo
  cp: CP5
  classificacao: Evolutivo
  relacionado: CP5
  justificativa: Meta de desempenho a refinar com massa de dados representativa.
  origem: [DF22]

- id: RNF22
  nome: Usabilidade da distribuição e do vínculo de casos
  cp: CP5
  classificacao: Evolutivo
  relacionado: RF20, RF21
  justificativa: Meta específica de usabilidade que pode ser refinada após validação do fluxo.

- id: RNF23
  nome: Modificabilidade do cadastro de áreas de especialidade
  cp: CP5
  classificacao: Não aplicável ao MVP
  relacionado: RF19 (removido)
  justificativa: Removido em 24/10/2026, junto com o RF19 ([DF26](decisoes-fbr.md#df26)).
  removido: 24/10/2026
  origem: [DF26]

- id: RNF24
  nome: Acessibilidade das telas de distribuição e consulta
  cp: CP5
  classificacao: Obrigatório para o MVP
  relacionado: CP5
  justificativa: Acessibilidade mínima das interfaces internas deve existir desde a primeira versão utilizável.

- id: RNF25
  nome: Sigilo do conteúdo clínico nas respostas negadas
  cp: CP6
  classificacao: Obrigatório para o MVP
  relacionado: RF27, RF28, RF55, RF66, RF69
  justificativa: 'O prontuário contém dados de saúde e exige proteção desde qualquer versão utilizável: a identificação registrada na criação do prontuário (RF66) e os dados iniciais, anamnese e contrato, registrados pelo RF69.'
  origem: [DF32]

- id: RNF26
  nome: Sigilo do conteúdo da evolução
  cp: CP7
  classificacao: Obrigatório para o MVP
  relacionado: RF28, RF55
  justificativa: Consolidado no RNF25 em 24/10/2026; a classificação acompanha a do RNF25.
  consolidado_em: RNF25

- id: RNF27
  nome: Integridade e proveniência dos registros de evolução
  cp: CP7
  classificacao: Obrigatório para o MVP
  relacionado: RF28, RF31, RF32, RF67, RF68
  justificativa: Registros clínicos precisam preservar autor, sessão, paciente e histórico, inclusive a validação do supervisor (RF67) e o encerramento por alta (RF68).

- id: RNF28
  nome: Auditoria das correções de evolução
  cp: CP7
  classificacao: Associado a RF do MVP
  relacionado: RF29
  justificativa: Acompanha a correção de evolução e preserva a versão original, condição mínima de confiabilidade do dado clínico.

- id: RNF29
  nome: Desempenho do registro e da consulta de evolução
  cp: CP7
  classificacao: Evolutivo
  relacionado: CP7
  justificativa: Meta quantitativa de desempenho a aferir após implementação do fluxo funcional.
  origem: [DF22]

- id: RNF30
  nome: Usabilidade do registro de evolução
  cp: CP7
  classificacao: Evolutivo
  relacionado: RF28
  justificativa: Meta de tempo/interações que pode ser refinada com testes de estagiários.

- id: RNF31
  nome: Fidelidade e rastreabilidade do relatório final
  cp: CP8
  classificacao: Associado a RF do MVP
  relacionado: RF33
  justificativa: Acompanha o relatório final de evolução, incluído no MVP em 24/10/2026.
  origem: [DF04]

- id: RNF32
  nome: Integridade e auditoria da contagem de faltas
  cp: CP9
  classificacao: Obrigatório para o MVP
  relacionado: RF34–RF38
