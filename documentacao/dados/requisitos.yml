# Catálogo integrado dos requisitos (AUD-30).
#
# É a fonte única dos atributos de cada requisito: CP, valor de negócio, esforço,
# decisão de MVP, ciclo, Líder de Feature, dependências, issue, estado da feature
# e origem nas decisões com a FBr (DF). A declaração e os critérios de aceitação
# continuam nas páginas de requisitos funcionais e não funcionais; as tabelas de priorização, MVP, backlog, os
# índices, as contagens e a coluna "Requisitos" do Registro de Decisões são
# geradas a partir daqui no build do site (documentacao/macros/catalogo.py).
#
# Como atualizar: mude o requisito aqui, na mesma PR em que mudar o texto dele.
# O estado (estado da feature no FDD, igual ao da issue) é atualizado na PR que
# muda o estado da feature. O docs-check confere o catálogo contra as páginas
# (documentacao/scripts/verificar_catalogo.py).
#
# Campos dos RFs:
#   esforco: [esforço, complexidade, lacuna de capacidade], escalas adotadas na Priorização e MVP
#   mvp: true/false; removido: data em que o requisito foi removido
#   motivo_mvp: só quando o motivo não é o da regra da definição do MVP
#   ciclo, ordem: ciclo de construção e ordem no backlog do MVP
#   depende: dependências obrigatórias (coluna "Depende de" do backlog)
#   estado: Planejada, Em design, Design inspecionado, Código concluído,
#           Código inspecionado, Promovida para a versão integrada, Demonstrada, Aceita
#   entrega: observação sobre a entrega (por exemplo, entrega parcial)
#   origem: decisões com a FBr (DF) que fundamentam o requisito

atualizado_em: 07/11/2026

cps:
  CP1: Inscrição on-line
  CP2: Triagem e sinalização de casos
  CP3: Fila de espera e consulta de posição
  CP4: Agendamento, confirmação e remarcação
  CP5: Distribuição de casos entre supervisores e estagiários
  CP6: Prontuário eletrônico
  CP7: Registro de evolução por sessão
  CP8: Geração do relatório final de evolução
  CP9: Controle de assiduidade e alertas
  CP10: Registros administrativos do atendimento
  CP11: Indicadores e relatórios institucionais
  CP12: Segurança, sigilo e controle de acesso
  CP13: Continuidade de casos entre semestres
  CP14: Acessibilidade e usabilidade

# Período e status dos ciclos de construção: fonte única do Cronograma geral, do
# cronograma da Unidade 3 e de Features e backlog. O status é revisto no
# fechamento de cada ciclo (Encerrado, Em andamento ou Aguardando).
ciclos:
- numero: 3
  periodo: 14/10 a 27/10/2026
  status: Encerrado
- numero: 4
  periodo: 28/10 a 10/11/2026
  status: Em andamento
- numero: 5
  periodo: 11/11 a 17/11/2026
  status: Aguardando
- numero: 6
  periodo: 18/11 a 01/12/2026
  status: Aguardando
- numero: 7
  periodo: 02/12 a 10/12/2026
  status: Aguardando

