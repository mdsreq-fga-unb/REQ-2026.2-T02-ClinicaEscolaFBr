- id: RNF45
  nome: Segurança da consulta pública de autenticidade
  cp: CP10
  classificacao: Não aplicável ao MVP
  relacionado: RF47
  justificativa: É exclusiva da validação pública de autenticidade; RF47 fica fora do MVP.

- id: RNF46
  nome: Atualização dos indicadores operacionais
  cp: CP11
  classificacao: Associado a RF do MVP
  relacionado: RF48
  justificativa: Acompanha a consulta de indicadores operacionais usada nos relatórios institucionais.

- id: RNF47
  nome: Tempo de geração do relatório institucional
  cp: CP11
  classificacao: Associado a RF do MVP
  relacionado: RF48, RF49
  justificativa: Acompanha a consulta de indicadores e a exportação do relatório institucional.

- id: RNF48
  nome: Auditoria de relatórios institucionais
  cp: CP11
  classificacao: Associado a RF do MVP
  relacionado: RF49
  justificativa: Acompanha a exportação do relatório institucional, registrando autoria e operação.

- id: RNF49
  nome: Proteção das credenciais de acesso
  cp: CP12
  classificacao: Obrigatório para o MVP
  relacionado: RF50, RF53
  justificativa: Senha, hash e bloqueio contra tentativas são controles mínimos de autenticação.
  origem: [DF25]

- id: RNF50
  nome: Expiração da sessão por inatividade
  cp: CP12
  classificacao: Obrigatório para o MVP
  relacionado: RF50, RF51
  justificativa: Reduz exposição de dados em computadores compartilhados.

- id: RNF51
  nome: Criptografia dos dados
  cp: CP12
  classificacao: Obrigatório para o MVP
  relacionado: Transversal
  justificativa: Protege dados sensíveis em trânsito e em repouso; condição de segurança e privacidade.

- id: RNF52
  nome: Trilha de auditoria de acessos ao prontuário
  cp: CP12
  classificacao: Obrigatório para o MVP
  relacionado: RF55, RF56
  justificativa: Acesso ao prontuário exige rastreabilidade de acessos permitidos e negados.

- id: RNF53
  nome: Cópia de segurança e recuperação dos dados
  cp: CP12
  classificacao: Obrigatório para o MVP
  relacionado: Transversal
  justificativa: Requisito mínimo de continuidade operacional e preservação dos registros.
  origem: [DF46]

- id: RNF54
  nome: Auditoria das decisões de continuidade
  cp: CP13
  classificacao: Não aplicável ao MVP
  relacionado: RF59
  justificativa: Depende do fluxo de continuidade entre semestres; toda a CP13 (RF58–RF60) fica fora do MVP.

- id: RNF55
  nome: Integridade do histórico na continuidade
  cp: CP13
  classificacao: Não aplicável ao MVP
  relacionado: RF60
  justificativa: Aplica-se à continuidade/transferência entre semestres; RF60 fica fora do MVP.

- id: RNF56
  nome: Conformidade com WCAG 2.2 nível AA
  cp: CP14
  classificacao: Obrigatório para o MVP
  relacionado: CP14 / páginas externas
  justificativa: Acessibilidade foi confirmada como mandatória pela FBr/MEC e deve existir desde o MVP, mesmo com RF61 e RF62 fora do recorte do MVP.

- id: RNF57
  nome: Aparência reforçada do indicador de foco
  cp: CP14
  classificacao: Evolutivo
  relacionado: RF61, RF62 / páginas externas
  justificativa: Exigência adicional de nível AAA; RF61 e RF62 ficam fora do MVP, mas a meta AA do RNF56 permanece obrigatória.

- id: RNF58
  nome: Responsividade da interface
  cp: CP14
  classificacao: Obrigatório para o MVP
  relacionado: Páginas externas
  justificativa: A solução é web responsiva e precisa funcionar entre 320 e 1920 px sem perda funcional.

- id: RNF59
  nome: Segurança do link de confirmação de presença
  cp: CP4
  classificacao: Obrigatório para o MVP
  relacionado: RF14
  justificativa: O link dispensa login e dá acesso a dados da sessão; a proteção contra uso por terceiros é condição mínima de segurança, separada da usabilidade do mesmo fluxo (RNF15) em 24/10/2026.

decisoes:

- id: DF01
  data: 26/08/2026
  fonte: reunião de levantamento
  decisao: O atendimento psicológico do estágio é exclusivamente presencial.
  outros: [CP4]

- id: DF02
  data: 26/08/2026
  fonte: reunião de levantamento
  decisao: 'Campos obrigatórios da inscrição: nome completo, data de nascimento, CPF, RG, endereço, estado civil e queixa; para menor de idade, também o responsável legal.'

- id: DF03
  data: 26/08/2026
  fonte: reunião de levantamento
  decisao: 'Referência da prioridade clínica: vermelha (quadro caracterizado), amarela (sofrimento pontual) e verde (desenvolvimento pessoal, atendido só com vaga sobrando).'

- id: DF04
  data: 26/08/2026
  fonte: reunião de levantamento
  decisao: O relatório final aprovado é entregue impresso ao paciente pela secretaria.

- id: DF05
  data: 26/08/2026
  fonte: reunião de levantamento
  decisao: A contribuição social é de R$ 35,00.

- id: DF06
  data: 02/10/2026
  fonte: validação do MVP
  decisao: O RF15 e o RF25 entram no MVP; o RF5, o RF13, o RF24 e o RF26 podem ficar para depois.
  outros: ['[Priorização e MVP](priorizacao-e-mvp.md#102-priorizacao-e-recorte-do-mvp)']

- id: DF07
  data: 02/10/2026
  fonte: validação do MVP
  decisao: O formulário de inscrição exibe um aviso fixo com os contatos do CVV (188) e do SAMU (192).

- id: DF08
  data: 02/10/2026
  fonte: validação do MVP
  decisao: A transferência de caso registra quem passou o caso, para quem, quando e por quê.

- id: DF09
  data: 02/10/2026
  fonte: validação do MVP
  decisao: A continuidade entre semestres é tratada caso a caso, pela transferência de caso.
  outros: ['CP13 (RF58 a RF60, fora do MVP)']

- id: DF10
  data: 07/10/2026
  fonte: validação do MVP
  decisao: O cancelamento para remarcar não conta falta do paciente nem do estagiário.

- id: DF11
  data: 07/10/2026
  fonte: validação do MVP
  decisao: A correção de evolução guarda a versão original.

- id: DF12
  data: 07/10/2026
  fonte: validação do MVP
  decisao: O relatório final e a reprovação do estagiário ficam prontos antes do fim do semestre.

- id: DF13
  data: 07/10/2026
  fonte: validação do MVP
  decisao: O apoio manual à inscrição é a recepção preenchendo o mesmo formulário do sistema.

- id: DF14
  data: 07/10/2026
  fonte: validação do MVP
  substituida_por: DF19
  decisao: O prazo da triagem seria um parâmetro definido pela coordenação.
  requisitos_anteriores: [RF4]

- id: DF15
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: O paciente tem 10 dias para pagar a contribuição social, contados do vínculo com o estagiário; sem pagamento, perde a vaga e volta para a fila. O início da contagem foi esclarecido pela equipe em 24/10/2026.

- id: DF16
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: Na mesma prioridade clínica, o desempate é pela data de inscrição, da mais antiga para a mais recente.

- id: DF17
  data: 23/10/2026
  fonte: validação do protótipo
  substituida_em_parte_por: DF50
  parte_substituida: na transferência de caso; com a DF50, a coordenação pode passar o caso a um supervisor no limite, com aviso
  decisao: Cada supervisor acompanha até 50 casos; o estagiário não tem limite fixo de casos.

- id: DF18
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: A sessão tem 50 minutos de atendimento, seguidos de 10 minutos para anotações.

- id: DF19
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: 'A clínica não tem prazo de triagem: a inscrição aguarda conforme as vagas, e só é chamada quando alguém sai.'

- id: DF20
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: O paciente pode cancelar até 1 hora antes da sessão, com justificativa. O desligamento continua com 2 faltas no ciclo, consecutivas ou não, como esclarecido pela equipe em 24/10/2026.

- id: DF21
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: O lembrete de sessão é enviado com 24 horas de antecedência.

- id: DF22
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: O pico de uso estimado é de 30 usuários simultâneos.

- id: DF23
  data: 23/10/2026
  fonte: validação do protótipo
  substituida_em_parte_por: DF38
  parte_substituida: nos campos da evolução; o fechamento avaliativo a cada 10 sessões continua valendo
  decisao: A evolução tem como campos obrigatórios a data, a evolução da queixa (até 10 linhas) e o planejamento da próxima sessão, com um fechamento avaliativo a cada 10 sessões.

- id: DF24
  data: 23/10/2026
  fonte: validação do protótipo
  substituida_em_parte_por: DF48
  parte_substituida: na escolha do canal preferencial; com a DF48, o e-mail e o celular são obrigatórios, e os contatos da clínica são feitos por e-mail
  decisao: O contato com o paciente é por e-mail, WhatsApp ou ligação; o SMS foi descartado. Quem escolhe e-mail recebe as mensagens automáticas; quem escolhe celular é contatado pela secretaria, por WhatsApp ou ligação. A ata em PDF registra também o e-mail como descartado, mas a gravação da reunião mostra que a escolha entre e-mail e celular foi mantida; a correção foi registrada pela equipe em 24/10/2026. Pela mesma regra, o código de verificação de identidade vai só por e-mail, e quem informou só o celular consulta a fila e pede a declaração na secretaria.

- id: DF25
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: O acesso é bloqueado por 15 minutos depois de 3 tentativas de login incorretas.

- id: DF26
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: 'Não há divisão por área de especialidade: todo atendimento é de psicologia clínica geral.'

- id: DF27
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: Cada caso tem um estagiário responsável; os estagiários de apoio do semestre básico só observam as sessões.

- id: DF28
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: Um caso pode ser transferido entre supervisores.

- id: DF29
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: A coordenação consulta as tentativas de acesso negado ao prontuário.

- id: DF30
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: O convite de ativação da conta vale 72 horas.

- id: DF31
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: Os protótipos das features do Ciclo 3 foram aprovados, com a remoção da área de especialidade e o ajuste dos canais de contato.
  outros: ['[Protótipos do Ciclo 3](../construcao/prototipos.md)']

- id: DF32
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: A coordenação consulta o conteúdo clínico de todos os prontuários, sem precisar de vínculo com o caso. A consulta é só de leitura e fica no registro de acessos. O ponto não consta da ata em PDF e foi registrado pela equipe em 24/10/2026.
  outros: [CP12]

- id: DF33
  data: 23/10/2026
  fonte: validação do protótipo
  decisao: Quem perde a vaga por falta de pagamento volta para a fila com a mesma prioridade clínica, mas com a data em que voltou para a fila, e não com a da inscrição original. Enquanto os 10 dias correm, continua bloqueado o agendamento da 2ª sessão em diante. O ponto não consta da ata em PDF e foi registrado pela equipe em 24/10/2026.

- id: DF34
  data: 30/10/2026
  fonte: respostas da FBr
  decisao: O estagiário responsável registra a alta com a data e o motivo, e o caso só é encerrado depois da confirmação do supervisor.

- id: DF35
  data: 30/10/2026
  fonte: respostas da FBr
  decisao: Só a coordenação reabre um caso encerrado por alta, com justificativa, no mesmo semestre e ciclo de atendimento. Todo semestre exige uma nova inscrição.

- id: DF36
  data: 30/10/2026
  fonte: respostas da FBr
  decisao: O supervisor aprova o relatório final ou o devolve com observações, e as versões anteriores são preservadas. O relatório é entregue impresso ao paciente depois da assinatura do supervisor.

- id: DF37
  data: 30/10/2026
  fonte: respostas da FBr
  decisao: 'A anamnese segue a ficha da Clínica Escola, com seis seções: queixa principal, história do problema atual, histórico familiar, desenvolvimento (infantil e adolescente), histórico médico e aspectos psicossociais.'

- id: DF38
  data: 30/10/2026
  fonte: respostas da FBr
  decisao: 'O registro de evolução segue a ficha da Clínica Escola: paciente, data, horário, número da sessão, comparecimento, humor e aparência, conteúdo trabalhado, técnicas utilizadas, intervenções e encaminhamentos, plano para a próxima sessão, estagiário e supervisor. Substitui os campos da DF23.'

- id: DF39
  data: 30/10/2026
  fonte: respostas da FBr
  decisao: O coordenador de Psicologia, Robson Araújo, representa a FBr na demonstração das features e registra o aceite em ata.
  outros: ['[DoD](dor-dod.md) (D5 e D6)']

- id: DF40
  data: 31/10/2026
  fonte: respostas da FBr
  decisao: A consulta da posição na fila e a declaração de comparecimento ficam só no site, com o código por e-mail, como na DF24. A FBr não vai usar serviço pago de mensagens, como a API oficial do WhatsApp. O telefone continua sendo coletado, para contatos extraordinários.

- id: DF41
  data: 31/10/2026
  fonte: respostas da FBr
  decisao: O contrato terapêutico segue o "Contrato de Prestação de Serviço" da Clínica Escola, com o termo de consentimento livre e esclarecido para pesquisa. O contrato tem as cláusulas de atendimento, sigilo e desmarcações e faltas, e é assinado pelo paciente, pelo coordenador do curso e pelo estagiário.

- id: DF42
  data: 31/10/2026
  fonte: respostas da FBr
  decisao: 'O relatório entregue ao paciente segue o modelo de relatório psicológico da Clínica Escola: identificação (paciente, solicitante, estagiário, supervisor com o CRP e finalidade), descrição da demanda, procedimentos, análise, conclusão, local e data, e as assinaturas do estagiário e do supervisor.'

- id: DF43
  data: 31/10/2026
  fonte: respostas da FBr
  substituida_em_parte_por: DF51
  parte_substituida: no contato de emergência, que com a DF51 passa a ser obrigatório
  decisao: Os dados da ficha de identificação da Clínica Escola que a inscrição ainda não pedia já podem ser coletados na inscrição.

- id: DF44
  data: 31/10/2026
  fonte: respostas da FBr
  decisao: A FBr não tem termo de consentimento para o uso dos dados. A equipe redige um modelo, com a finalidade, o prazo de guarda e como revogar, e a FBr revisa.

- id: DF45
  data: 31/10/2026
  fonte: respostas da FBr
  decisao: O paciente confirma a presença até 24 horas antes do início da sessão. O prazo foi sugerido por Thiago Viana e aprovado por Robson Araújo, no lugar das 12 horas propostas pela equipe.

- id: DF46
  data: 31/10/2026
  fonte: respostas da FBr
  decisao: A FBr, que hospeda o sistema no próprio servidor, cuida das cópias de segurança e de onde elas ficam guardadas.

- id: DF47
  data: 06/11/2026
  fonte: validação do Ciclo 3
  decisao: Na inscrição de menor de idade, o CPF do responsável legal é obrigatório, para não ser confundido com o do paciente. Decidido por Thiago Viana na reunião de validação, confirmando a proposta da equipe para o consentimento (RF57); a confirmação de Robson Araújo foi pedida por e-mail.

- id: DF48
  data: 06/11/2026
  fonte: validação do Ciclo 3
  decisao: A inscrição deixa de pedir a escolha do canal preferencial de contato. O e-mail e o telefone celular passam a ser obrigatórios, e a inscrição avisa que os contatos da clínica são feitos por e-mail. Decidido por Thiago Viana na reunião de validação; a confirmação de Robson Araújo foi pedida por e-mail.

- id: DF49
  data: 06/11/2026
  fonte: validação do Ciclo 3
  decisao: No agendamento, os horários de início e de término são escolhidos de 10 em 10 minutos, e não minuto a minuto, porque a sessão tem 50 minutos de atendimento e 10 de anotações (DF18). Decidido por Thiago Viana na reunião de validação.

- id: DF50
  data: 11/11/2026
  fonte: respostas da FBr por WhatsApp
  decisao: Na transferência de caso (RF25), a coordenação pode escolher um supervisor que já acompanha o limite de casos (DF17), com um aviso na tela. Respondido por Robson Araújo.

- id: DF51
  data: 11/11/2026
  fonte: respostas da FBr por WhatsApp
  decisao: O contato de emergência da ficha de identificação passa a ser obrigatório na inscrição. Robson Araújo pediu também os "dados mínimos para reconhecimento" do paciente, e quais são foi perguntado a ele.

- id: DF52
  data: 11/11/2026
  fonte: respostas da FBr por WhatsApp
  decisao: O motivo da justificativa de falta continua visível para a secretaria e fica disponível para os órgãos fiscalizadores (CRP, CFP e Secretaria de Saúde), que podem pedir para vê-lo. Respondido por Robson Araújo.

- id: DF53
  data: 11/11/2026
  fonte: respostas da FBr por WhatsApp
  decisao: Os estagiários avisam os pacientes desligados por faltas, por fora do sistema. Respondido por Robson Araújo.

- id: DF54
  data: 11/11/2026
  fonte: respostas da FBr por WhatsApp
  decisao: O relatório final de evolução e a reprovação do estagiário ficam prontos até 05/12/2026, data final da evolução do estágio. Respondido por Robson Araújo.


