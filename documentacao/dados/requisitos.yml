  cp: CP10
  classificacao: Obrigatório para o MVP
  relacionado: RF44, RF45
  justificativa: A interface de emissão deve atender requisitos mínimos de acessibilidade.

- id: RNF44
  nome: Integridade do conteúdo da declaração
  cp: CP10
  classificacao: Associado a RF do MVP
  relacionado: RF45
