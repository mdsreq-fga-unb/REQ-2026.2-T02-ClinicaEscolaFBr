# Implantação no Coolify da FBr: um projeto com dois ambientes (production, da
# main, e validacao, da development), cada um com este compose. As imagens vêm
# do GHCR, compiladas pelo workflow "Implantação"; os valores ficam nas variáveis
# de cada ambiente no Coolify. Procedimento: documentacao/docs/unidade-3/implantacao.md
services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: ${SENHA_BANCO:?}
      POSTGRES_DB: clinica
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica"]
      interval: 5s
      retries: 10

  # Aplica as migrations e as permissões do clinica_app com o dono do banco e sai.
  # No Coolify, este serviço leva também `exclude_from_hc: true`, para o contêiner
  # encerrado não deixar o ambiente como "fora do ar".
  migrador:
    image: ${IMAGEM_API:?}
    pull_policy: always
    command: ["node", "dist/scripts/migrar.js"]
    environment:
      DATABASE_URL: postgresql://clinica:${SENHA_BANCO}@banco:5432/clinica
      CLINICA_APP_SENHA: ${SENHA_CLINICA_APP:-}
    depends_on:
      banco:
        condition: service_healthy
    restart: "no"

  api:
    image: ${IMAGEM_API:?}
    pull_policy: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_API:?}
      # A API e a web escutam na 80, a porta que o Coolify usa para os domínios.
      API_PORT: 80
      WEB_URL: ${WEB_URL:?}
      CHAVE_DADOS: ${CHAVE_DADOS:?}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:?}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_EHLO: ${SMTP_EHLO:-}
      SALTOS_DE_PROXY: ${SALTOS_DE_PROXY:-1}
    depends_on:
      migrador:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ${IMAGEM_WEB:?}
    pull_policy: always
    environment:
      PORT: 80
    depends_on:
      - api
    restart: unless-stopped

volumes:
  banco:
