# Padroniza o título das PRs no formato "destino <- origem | descrição".
# Quem abre a PR escreve só a descrição; o prefixo é acrescentado (ou corrigido,
# se a branch de destino mudar) automaticamente.
name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  padronizar:
    name: Padronizar título
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prefixo = `${pr.base.ref} <- ${pr.head.ref} | `;
            const atual = pr.title.trim();
            // Remove um prefixo "destino <- origem | " já existente, mesmo que desatualizado.
            const descricao = atual.replace(/^\S+\s*<-\s*\S+\s*\|\s*/, "").trim() || atual;
            const titulo = `${prefixo}${descricao}`;
            if (titulo !== pr.title) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: titulo,
              });
              core.info(`Título atualizado para: ${titulo}`);
            } else {
              core.info("Título já está no padrão.");
            }
