# Acompanhamento automático das issues de feature (FDD): o "Estado da feature" da
# issue e o Status do Project seguem o checklist do DoR e do DoD, as PRs que citam
# a issue e os comandos /de-acordo, /demonstrada e /aceite (regras em
# .github/scripts/feature-status). Precisa do segredo PROJECT_TOKEN, um token com
# os escopos repo e project; sem ele, o workflow só avisa e não altera nada.
name: Feature Status

on:
  issues:
    types: [opened, edited, milestoned, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review, edited, closed]
  pull_request_review:
    types: [submitted]
  schedule:
    # Todo dia às 8h de Brasília: alinha as features que mudaram sem evento.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Uma execução por issue ou PR de cada vez, para as edições não se cruzarem.
concurrency:
  group: feature-status-${{ github.event.issue.number || github.event.pull_request.number || 'todas' }}
  cancel-in-progress: false

jobs:
  acompanhar:
    name: Acompanhar features
    # Comentários em PR não interessam; o resto passa pelo script.
    if: github.event_name != 'issue_comment' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        env:
          TEM_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || github.token }}
          script: |
            const acompanhar = require('./.github/scripts/feature-status/index.cjs');
            await acompanhar({ github, context, core });

  issue-da-feature:
    name: PR cita a issue da feature
    # PRs de feature precisam citar a issue (por exemplo, "Refs #48").
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.event.pull_request.title, 'feat')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        with:
          script: |
            const { issuesCitadas } = require('./.github/scripts/feature-status/logica.cjs');
            const pr = context.payload.pull_request;
            if (issuesCitadas(pr.title, pr.body).length === 0) {
              core.setFailed('A PR de feature precisa citar a issue da feature na descrição, por exemplo "Refs #48".');
            }

  testes:
    name: Testes das regras
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test ".github/scripts/feature-status/*.test.cjs"
