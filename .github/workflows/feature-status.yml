# Acompanhamento automático das issues de feature (FDD): o "Estado da feature" da
# issue e o Status do Project seguem o checklist do DoR e do DoD, as PRs que citam
# a issue, os comandos /de-acordo, /demonstrada, /aceite e /rnf e os testes da
# versão integrada, para o D4.5 (regras em .github/scripts/feature-status). Precisa do segredo PROJECT_TOKEN, um token com
# os escopos repo e project; sem ele, o workflow só avisa e não altera nada.
name: Feature Status

on:
  issues:
    types: [opened, edited, milestoned, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review, edited, closed]
  pull_request_review:
    types: [submitted]
  # CI ou testes com leitor de tela concluídos na main: o relatório dos testes
  # reavalia o D4.5 das features.
  workflow_run:
    workflows: [CI, Leitor de tela]
    types: [completed]
    branches: [main]
  schedule:
    # Todo dia às 8h de Brasília: alinha as features que mudaram sem evento.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Para baixar o relatório de RNFs gerado pelo CI da main.
  actions: read

# Uma execução por issue ou PR de cada vez, para as edições não se cruzarem.
concurrency:
  group: feature-status-${{ github.event.issue.number || github.event.pull_request.number || 'todas' }}
  cancel-in-progress: false

jobs:
  acompanhar:
    name: Acompanhar features
    # Comentários em PR não interessam; o resto passa pelo script.
    if: github.event_name != 'issue_comment' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Baixar os relatórios de RNFs da main
        if: >-
          github.event_name == 'workflow_run' || github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/rnf'))
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUCAO: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          # Um relatório do CI e um dos testes com leitor de tela. Do workflow que
          # acabou de concluir, o daquela execução; do outro, o mais recente da main.
          # Sem nenhum relatório (PR só de documentação), segue sem ele.
          ultimo() {
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=30" \
              --jq '[.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not))][0].workflow_run.id // empty'
          }
          CI=""; LEITOR=""
          if [ "$WORKFLOW" = "CI" ]; then CI="$EXECUCAO"; fi
          if [ "$WORKFLOW" = "Leitor de tela" ]; then LEITOR="$EXECUCAO"; fi
          [ -n "$CI" ] || CI=$(ultimo rnfs-verificados)
          [ -n "$LEITOR" ] || LEITOR=$(ultimo rnfs-leitor-de-tela)
          RUNS="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs"
          FONTES=()
          if [ -n "$CI" ] && gh run download "$CI" -R "$GITHUB_REPOSITORY" -n rnfs-verificados -D "$RUNNER_TEMP/ci"; then
            FONTES+=("$RUNNER_TEMP/ci/rnfs-verificados.json" "$RUNS/$CI")
            echo "EXECUCAO_RNFS=$RUNS/$CI" >> "$GITHUB_ENV"
          fi
          if [ -n "$LEITOR" ] && gh run download "$LEITOR" -R "$GITHUB_REPOSITORY" -n rnfs-leitor-de-tela -D "$RUNNER_TEMP/leitor"; then
            FONTES+=("$RUNNER_TEMP/leitor/rnfs-verificados.json" "$RUNS/$LEITOR")
          fi
          if [ ${#FONTES[@]} -gt 0 ]; then
            node .github/scripts/feature-status/juntar-rnfs.cjs "$RUNNER_TEMP/rnfs-verificados.json" "${FONTES[@]}"
            echo "RELATORIO_RNFS=$RUNNER_TEMP/rnfs-verificados.json" >> "$GITHUB_ENV"
          else
            echo "::notice::Sem relatório de RNFs da main: o D4.5 não foi avaliado nesta execução."
          fi
      - uses: actions/github-script@v9
        env:
          TEM_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || github.token }}
          script: |
            const acompanhar = require('./.github/scripts/feature-status/index.cjs');
            await acompanhar({ github, context, core });

  issue-da-feature:
    name: PR cita a issue da feature
    # PRs de feature precisam declarar a issue (por exemplo, "Refs #48").
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.event.pull_request.title, 'feat')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        with:
          script: |
            const { issuesCitadas } = require('./.github/scripts/feature-status/logica.cjs');
            const pr = context.payload.pull_request;
            if (issuesCitadas(pr.title, pr.body).length === 0) {
              core.setFailed('A PR de feature precisa declarar a issue da feature na descrição, com "Refs", "Closes", "Fixes" ou "Resolves", por exemplo "Refs #48".');
            }

  testes:
    name: Testes das regras
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test ".github/scripts/feature-status/*.test.cjs"
