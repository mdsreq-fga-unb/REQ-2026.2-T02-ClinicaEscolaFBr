name: Deploy MkDocs Documentation

# O site é publicado a partir da development, a versão integrada: cada merge
# aparece no GitHub Pages, sem esperar a PR main <- development. Na publicação, o
# estado das features e a situação dos ciclos vêm das issues e dos milestones
# (SINCRONIZAR_GITHUB); por isso todo merge publica de novo, e não só os que mexem
# na documentação.
on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write
  # Para ler o "Estado da feature" das issues e os milestones dos ciclos.
  issues: read

# Dois merges seguidos não publicam ao mesmo tempo na gh-pages; vale o mais recente.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    # A execução manual também só publica a development: rodada a partir da main,
    # ela publicaria a documentação de antes da última promoção.
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: documentacao/requirements.txt

      # Versões fixas, as mesmas do docs-check (AUD-35).
      - name: Install dependencies
        run: pip install -r documentacao/requirements.txt

      # A data do commit publicado aparece no rodapé do site ("Última publicação").
      - name: Build and deploy site to gh-pages branch
        env:
          SINCRONIZAR_GITHUB: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs gh-deploy --force --strict --config-file documentacao/mkdocs.yml
