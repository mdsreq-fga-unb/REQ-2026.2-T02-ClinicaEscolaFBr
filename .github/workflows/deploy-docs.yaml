name: Deploy MkDocs Documentation

# O site é publicado a partir da development, a versão integrada: cada merge que
# muda a documentação aparece no GitHub Pages, sem esperar a PR main <- development.
on:
  push:
    branches:
      - development
    paths:
      - "documentacao/**"
      - ".github/workflows/deploy-docs.yaml"
  workflow_dispatch:

permissions:
  contents: write

# Dois merges seguidos não publicam ao mesmo tempo na gh-pages; vale o mais recente.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    # A execução manual também só publica a development: rodada a partir da main,
    # ela publicaria a documentação de antes da última promoção.
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: documentacao/requirements.txt

      # Versões fixas, as mesmas do docs-check (AUD-35).
      - name: Install dependencies
        run: pip install -r documentacao/requirements.txt

      # A data do commit publicado aparece no rodapé do site ("Última publicação").
      - name: Build and deploy site to gh-pages branch
        run: mkdocs gh-deploy --force --strict --config-file documentacao/mkdocs.yml
