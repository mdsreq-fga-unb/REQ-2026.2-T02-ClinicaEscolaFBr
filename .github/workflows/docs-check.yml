# Confere o catálogo de requisitos e compila o site de documentação nas PRs que
# mexem em documentacao/, para que erros apareçam antes do merge (o deploy em si
# continua no deploy-docs.yaml, a cada merge na development). O build é estrito: páginas fora do
# menu, links quebrados e âncoras inválidas falham a verificação.
name: Docs Check

on:
  pull_request:
    branches: [development, main]
    paths:
      - "documentacao/**"
      - ".github/workflows/docs-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar a documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: documentacao/requirements.txt
      - run: pip install -r documentacao/requirements.txt
      - name: Conferir o catálogo de requisitos
        run: python documentacao/scripts/verificar_catalogo.py
      - name: Testar a sincronização do catálogo com o GitHub
        run: python documentacao/scripts/testar_sincronizacao.py
      - name: Compilar o site no modo estrito
        run: mkdocs build --strict --config-file documentacao/mkdocs.yml
