name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um push novo na mesma PR cancela a execução anterior (na main, nada é cancelado).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.filtro.outputs.codigo }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filtro
        with:
          filters: |
            codigo:
              - "apps/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - ".github/workflows/ci.yml"

  verificar:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: clinica
          POSTGRES_DB: clinica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinica"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clinica:clinica@localhost:5432/clinica
      API_PORT: 3333
      WEB_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      # Chave só de teste, sem dados reais (RNF51).
      CHAVE_DADOS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_PUBLIC_API_URL: http://localhost:3333
      # Os testes gravam o resultado de cada um em relatorio-testes/ (relatório de RNFs).
      RELATORIO_TESTES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@clinica/database...
      - run: pnpm db:migrate
      - run: pnpm turbo run lint typecheck test build
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: relatorio-testes-verificar
          path: apps/*/relatorio-testes/*.json
          if-no-files-found: ignore

  e2e:
    needs: [mudancas, verificar]
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    # O e2e sobe a API compilada (playwright.config.ts), que precisa do banco migrado e da chave.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: clinica
          POSTGRES_DB: clinica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinica"
          --health-interval 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3333
      DATABASE_URL: postgresql://clinica:clinica@localhost:5432/clinica
      API_PORT: 3333
      WEB_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      # Chave apenas para dados fictícios deste job; nunca usada em produção.
      CHAVE_DADOS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RELATORIO_TESTES: "1"
      # Os testes mandam muitas inscrições da mesma origem (localhost).
      LIMITE_INSCRICOES_POR_ORIGEM: "1000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clinica/web exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@clinica/web... --filter=@clinica/api...
      - run: pnpm db:migrate
      - run: pnpm --filter @clinica/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: evidencias-e2e
          path: apps/web/test-results
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: relatorio-testes-e2e
          path: apps/web/relatorio-testes/e2e.json
          if-no-files-found: ignore

  # Junta os resultados dos testes no relatório dos RNFs verificados, que o Feature
  # Status usa para avaliar o D4.5 das features (convenção em "Boas práticas de
  # utilização do GitHub"). Só informa: não bloqueia a PR.
  rnfs:
    name: Relatório de RNFs
    needs: [mudancas, verificar, e2e]
    if: ${{ !cancelled() && needs.mudancas.outputs.codigo == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: relatorio-testes-*
          path: relatorio-testes
      - run: node .github/scripts/feature-status/coletar-rnfs.cjs relatorio-testes rnfs-verificados.json
      - uses: actions/upload-artifact@v7
        with:
          name: rnfs-verificados
          path: rnfs-verificados.json

  resultado:
    if: always()
    needs: [mudancas, verificar, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado dos jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
