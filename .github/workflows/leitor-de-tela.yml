name: Leitor de tela

# Testes com o VoiceOver de verdade (RNF24), num runner macOS. Rodam toda semana e
# quando as telas cobertas mudam. Não bloqueiam a PR. Na main, o relatório dos
# testes (rnfs-leitor-de-tela) entra no D4.5 das features pelo Feature Status.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/src/app/(interno)/distribuicao/**"
      - "apps/web/src/app/(interno)/meus-casos/**"
      - "apps/web/src/components/comum/**"
      - "apps/web/e2e/leitor-de-tela/**"
      - "apps/web/playwright.leitor-de-tela.config.ts"
      - ".github/workflows/leitor-de-tela.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/app/(interno)/distribuicao/**"
      - "apps/web/src/app/(interno)/meus-casos/**"
      - "apps/web/src/components/comum/**"
      - "apps/web/e2e/leitor-de-tela/**"
      - "apps/web/playwright.leitor-de-tela.config.ts"
      - ".github/workflows/leitor-de-tela.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voiceover:
    name: VoiceOver (RNF24)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3333
      # Os testes gravam o resultado em relatorio-testes/ (relatório de RNFs).
      RELATORIO_TESTES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # guidepup/setup-action 0.21.0: libera o VoiceOver para ser controlado.
      - uses: guidepup/setup-action@acf1a64cc26292ebe0db6a28d1341bd1bae93c65
        with:
          record: true
      # O preparo da versão do Guidepup do projeto: cria as preferências locais do
      # VoiceOver, que a action acima (de uma versão anterior) não cria. Sem
      # --macos-record: a gravação usa o ffmpeg, que o pnpm não baixa, e a action
      # já grava a tela.
      - run: pnpm --filter @clinica/web exec guidepup setup --ci
      # Arquivos do VoiceOver da versão do Guidepup instalada no projeto.
      - run: pnpm --filter @clinica/web exec guidepup install voiceover
      - run: pnpm --filter @clinica/web exec playwright install webkit
      - run: pnpm turbo run build --filter=@clinica/web...
      - run: pnpm --filter @clinica/web test:leitor-de-tela
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: evidencias-leitor-de-tela
          path: |
            apps/web/test-results
            recordings
          if-no-files-found: ignore
      - run: node .github/scripts/feature-status/coletar-rnfs.cjs apps/web/relatorio-testes rnfs-verificados.json
        if: (success() || failure()) && hashFiles('apps/web/relatorio-testes/*.json') != ''
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: rnfs-leitor-de-tela
          path: rnfs-verificados.json
          if-no-files-found: ignore
