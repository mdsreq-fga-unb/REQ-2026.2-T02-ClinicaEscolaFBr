name: Segredos

# Busca de chaves, senhas e tokens em todo o histórico do repositório (RNF51:
# nenhuma chave no código), com o gitleaks e as exceções do .gitleaks.toml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Chaves no repositório (RNF51)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks 8.30.1, conferido pelo SHA-256 publicado na versão.
      - name: Instalar o gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Procurar chaves em todo o histórico
        run: ./gitleaks git . --redact --no-banner --config .gitleaks.toml
